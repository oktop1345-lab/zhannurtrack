<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер учёбы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0eee8; --border:#e4e1d8;
  --text:#1d1c1a; --muted:#6f6c64; --accent:#5b4fe0; --danger:#d64545;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131316; --surface:#1c1c21; --surface-2:#25252c; --border:#2e2e36;
    --text:#ecebf0; --muted:#9a98a6; --accent:#8f85ff; --danger:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#131316; --surface:#1c1c21; --surface-2:#25252c; --border:#2e2e36;
  --text:#ecebf0; --muted:#9a98a6; --accent:#8f85ff; --danger:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
h2{font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.top{grid-template-columns:1.25fr 1fr}
.charts{grid-template-columns:1.6fr 1fr;margin-top:16px}
@media (max-width:820px){.top,.charts{grid-template-columns:1fr}}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface-2);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media (max-width:420px){.subjects{grid-template-columns:1fr}}
.subj{position:relative;text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.subj .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.subj .dot{width:10px;height:10px;border-radius:50%;flex:none}
.subj .today{font-size:12px;color:var(--muted);margin-top:2px}
.subj.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.subj.add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:500}

/* timer */
.timer-box{text-align:center;padding:8px 0 4px}
.modes{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:14px;gap:2px}
.modes button{border:none;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.modes button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.ring{position:relative;width:220px;height:220px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time b{font:700 40px/1 "JetBrains Mono",monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .time span{font-size:13px;color:var(--muted);margin-top:6px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;justify-content:center;margin:16px 0 12px;flex-wrap:wrap}
textarea{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:10px 12px;resize:vertical;min-height:60px}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:8px 10px;width:100%}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.goal{margin-top:4px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.goal-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;align-items:center}

/* manual add */
details.manual{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
details.manual summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* charts */
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{border:none;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text)}
#barChart{width:100%;height:260px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.donut-list{width:100%;font-size:13px}
.donut-list div{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
.donut-list div:last-child{border:none}
.donut-list b{margin-left:auto;font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;z-index:20;opacity:0;transition:opacity .1s;max-width:220px}
.tip div{display:flex;gap:6px;align-items:center}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2);display:block}

/* history */
.history{margin-top:16px}
.day{margin-bottom:16px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:capitalize}
.sess{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:6px}
.sess .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.sess .body{flex:1;min-width:0}
.sess .t{font-weight:600;font-size:14px}
.sess .n{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.sess .d{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
.filters{display:flex;gap:8px;align-items:center}
.filters select{width:auto;padding:5px 8px;font-size:13px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal.open{display:flex}
.modal .card{width:100%;max-width:420px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--text)}
.sub-list .it{display:flex;align-items:center;gap:8px;padding:6px 0}
.sub-list .it input{flex:1}
.footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Трекер учёбы<small id="todayLabel"></small></h1>
    <div style="display:flex;gap:8px">
      <button class="btn small ghost" id="themeBtn" title="Тема">◐ Тема</button>
      <button class="btn small ghost" id="manageBtn">⚙ Предметы</button>
    </div>
  </header>

  <div class="grid top">
    <!-- Timer -->
    <section class="card">
      <h2>Выбери предмет</h2>
      <div class="subjects" id="subjects"></div>

      <div class="timer-box">
        <div class="modes" id="modes">
          <button data-mode="stopwatch" class="on">Секундомер</button>
          <button data-mode="25">Помодоро 25</button>
          <button data-mode="50">Фокус 50</button>
        </div>
        <div class="ring">
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="98" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
            <circle id="ringProg" cx="110" cy="110" r="98" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="615.75" stroke-dashoffset="615.75" style="transition:stroke-dashoffset .5s linear,stroke .3s"/>
          </svg>
          <div class="time"><b id="clock">00:00:00</b><span id="clockSubj">—</span></div>
        </div>
        <div class="controls">
          <button class="btn primary" id="startBtn">▶ Старт</button>
          <button class="btn" id="finishBtn" disabled>✓ Завершить и сохранить</button>
          <button class="btn ghost" id="resetBtn" disabled>Сбросить</button>
        </div>
        <textarea id="noteInput" placeholder="Что учил? (например: «Символы Кристоффеля, задачи 3–7»)"></textarea>
      </div>

      <details class="manual">
        <summary>+ Добавить занятие вручную</summary>
        <div class="row2">
          <div><label class="f">Предмет</label><select id="mSubj"></select></div>
          <div><label class="f">Дата</label><input type="date" id="mDate"></div>
        </div>
        <div class="row2">
          <div><label class="f">Часы</label><input type="number" id="mH" min="0" value="0"></div>
          <div><label class="f">Минуты</label><input type="number" id="mM" min="0" max="59" value="30"></div>
        </div>
        <label class="f">Что учил</label>
        <textarea id="mNote" placeholder="Тема, задачи, глава…"></textarea>
        <div style="margin-top:10px;text-align:right"><button class="btn primary small" id="mAdd">Добавить</button></div>
      </details>
    </section>

    <!-- Stats -->
    <section class="card">
      <h2>Сводка</h2>
      <div class="stats">
        <div class="stat"><div class="v" id="sToday">0м</div><div class="l">сегодня</div></div>
        <div class="stat"><div class="v" id="sWeek">0м</div><div class="l">за 7 дней</div></div>
        <div class="stat"><div class="v" id="sStreak">0</div><div class="l">дней подряд 🔥</div></div>
      </div>
      <div class="goal">
        <div class="goal-row"><span>Цель на день: <b id="goalVal"></b></span><button class="icon-btn" id="goalBtn" title="Изменить цель">✎</button></div>
        <div class="bar"><i id="goalBar" style="width:0"></i></div>
      </div>
      <h2 style="margin-top:22px">Активность за 20 недель</h2>
      <div class="heat" id="heat"></div>
    </section>
  </div>

  <div class="grid charts">
    <section class="card">
      <h2>По дням
        <span class="seg" id="rangeSeg">
          <button data-r="7" class="on">7 дней</button>
          <button data-r="14">14</button>
          <button data-r="30">30</button>
        </span>
      </h2>
      <svg id="barChart"></svg>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card">
      <h2>Распределение
        <span class="seg" id="donutSeg">
          <button data-r="7" class="on">Неделя</button>
          <button data-r="30">Месяц</button>
          <button data-r="0">Всё</button>
        </span>
      </h2>
      <div class="donut-wrap">
        <svg id="donut" width="180" height="180" viewBox="0 0 180 180"></svg>
        <div class="donut-list" id="donutList"></div>
      </div>
    </section>
  </div>

  <section class="card history">
    <h2>История
      <span class="filters"><select id="histFilter"><option value="">Все предметы</option></select></span>
    </h2>
    <div id="history"></div>
  </section>

  <div class="footer">
    <button class="btn small ghost" id="exportBtn">⬇ Экспорт данных</button>
    <button class="btn small ghost" id="importBtn">⬆ Импорт</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>

<!-- Manage subjects modal -->
<div class="modal" id="manageModal">
  <div class="card">
    <h2>Предметы <button class="icon-btn" data-close>✕</button></h2>
    <div class="sub-list" id="subList"></div>
    <label class="f">Новый предмет</label>
    <div style="display:flex;gap:8px"><input type="text" id="newSubj" placeholder="Название"><button class="btn primary small" id="addSubj">Добавить</button></div>
    <div class="colors" id="newColors"></div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
const KEY = 'study-tracker-v1';
const PALETTE = ['#7c6cf0','#2fb38a','#e8913a','#3d8de0','#e05a8a','#c9a227','#20a4b5','#8a6d5a'];
const DEFAULT = {
  subjects: [
    {id:'tensor', name:'Тензорный анализ', color:'#7c6cf0'},
    {id:'english', name:'Английский', color:'#2fb38a'},
    {id:'linalg', name:'Линейная алгебра', color:'#e8913a'},
    {id:'em', name:'Электричество и магнетизм', color:'#3d8de0'},
  ],
  sessions: [],
  goal: 120,
  timer: {subjectId:'tensor', mode:'stopwatch', running:false, startedAt:0, acc:0, note:''},
  theme: ''
};

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
S = Object.assign(structuredClone(DEFAULT), S || {});
if (!Array.isArray(S.subjects) || !S.subjects.length) S.subjects = structuredClone(DEFAULT.subjects);
if (!Array.isArray(S.sessions)) S.sessions = [];
S.timer = Object.assign({}, DEFAULT.timer, S.timer);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const subj = id => S.subjects.find(s => s.id === id) || {name:'(удалён)', color:'#999', id};
const fmtMin = m => { if (m > 0 && m < 1) return '<1м'; m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}ч ${r}м` : `${h}ч`) : `${r}м`; };
const minutesOn = (date, sid) => S.sessions.filter(x => x.date === date && (!sid || x.subjectId === sid)).reduce((a,x) => a + x.dur/60, 0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); };

/* theme */
const applyTheme = () => { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; };
$('themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

$('todayLabel').textContent = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});

/* ---------- Subjects ---------- */
function renderSubjects() {
  const box = $('subjects'); box.innerHTML = '';
  const t = today();
  S.subjects.forEach(s => {
    const b = document.createElement('button');
    b.className = 'subj' + (S.timer.subjectId === s.id ? ' active' : '');
    b.style.setProperty('--c', s.color);
    b.innerHTML = `<div class="name"><span class="dot" style="background:${s.color}"></span><span></span></div><div class="today">сегодня: ${fmtMin(minutesOn(t, s.id))}</div>`;
    b.querySelector('.name span:last-child').textContent = s.name;
    b.onclick = () => {
      if (S.timer.running || S.timer.acc > 0) { if (!confirm('Таймер уже идёт. Переключить предмет для текущей сессии?')) return; }
      S.timer.subjectId = s.id; save(); renderSubjects(); tick();
    };
    box.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'subj add'; add.textContent = '+ свой предмет';
  add.onclick = openManage;
  box.appendChild(add);

  // selects
  const opts = S.subjects.map(s => `<option value="${s.id}"></option>`).join('');
  $('mSubj').innerHTML = opts;
  [...$('mSubj').options].forEach((o,i) => o.textContent = S.subjects[i].name);
  $('mSubj').value = S.timer.subjectId;
  const hf = $('histFilter'), cur = hf.value;
  hf.innerHTML = '<option value="">Все предметы</option>' + opts;
  [...hf.options].slice(1).forEach((o,i) => o.textContent = S.subjects[i].name);
  hf.value = S.subjects.some(s => s.id === cur) ? cur : '';
}

/* ---------- Timer ---------- */
const CIRC = 2 * Math.PI * 98;
const elapsed = () => S.timer.acc + (S.timer.running ? (Date.now() - S.timer.startedAt)/1000 : 0);
const target = () => S.timer.mode === 'stopwatch' ? 0 : Number(S.timer.mode) * 60;

function tick() {
  const e = elapsed(), tg = target();
  const shown = tg ? Math.max(0, tg - e) : e;
  const sec = Math.floor(shown);
  $('clock').textContent = `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;
  const s = subj(S.timer.subjectId);
  $('clockSubj').textContent = s.name;
  const ring = $('ringProg');
  ring.style.stroke = s.color;
  const frac = tg ? Math.min(1, e/tg) : (e % 3600) / 3600;
  ring.setAttribute('stroke-dashoffset', CIRC * (1 - frac));
  $('startBtn').textContent = S.timer.running ? '❚❚ Пауза' : (e > 0 ? '▶ Продолжить' : '▶ Старт');
  $('finishBtn').disabled = e < 1;
  $('resetBtn').disabled = e < 1;
  document.title = S.timer.running ? `${$('clock').textContent} · ${s.name}` : 'Трекер учёбы';
  if (tg && S.timer.running && e >= tg) {
    pause();
    beep();
    toast('Время вышло! Сохрани сессию или продолжай.');
    if (Notification && Notification.permission === 'granted') new Notification('Помодоро завершён', {body: s.name});
  }
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch(e) {}
}
function pause() { S.timer.acc = elapsed(); S.timer.running = false; save(); }
$('startBtn').onclick = () => {
  if (S.timer.running) pause();
  else {
    S.timer.running = true; S.timer.startedAt = Date.now(); save();
    try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch(e) {}
  }
  tick();
};
$('finishBtn').onclick = () => {
  const dur = Math.round(elapsed());
  if (dur < 1) return;
  const start = Date.now() - dur*1000;
  S.sessions.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), subjectId: S.timer.subjectId, date: today(), start, dur, note: $('noteInput').value.trim()});
  S.timer = Object.assign({}, S.timer, {running:false, acc:0, startedAt:0, note:''});
  $('noteInput').value = '';
  save(); renderAll();
  toast(`Сохранено: ${fmtMin(dur/60)} — ${subj(S.sessions.at(-1).subjectId).name}`);
};
$('resetBtn').onclick = () => {
  if (!confirm('Сбросить таймер без сохранения?')) return;
  S.timer.running = false; S.timer.acc = 0; save(); tick();
};
$('noteInput').value = S.timer.note || '';
$('noteInput').oninput = e => { S.timer.note = e.target.value; save(); };
$('modes').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.timer.mode = b.dataset.mode; save(); renderModes(); tick();
};
function renderModes() { [...$('modes').children].forEach(b => b.classList.toggle('on', b.dataset.mode === S.timer.mode)); }

/* ---------- Manual add ---------- */
$('mDate').value = today();
$('mAdd').onclick = () => {
  const m = (Number($('mH').value)||0)*60 + (Number($('mM').value)||0);
  if (m <= 0) return toast('Укажи длительность');
  const date = $('mDate').value || today();
  S.sessions.push({id: String(Date.now()) + Math.random(), subjectId: $('mSubj').value, date, start: new Date(date + 'T12:00').getTime(), dur: m*60, note: $('mNote').value.trim()});
  $('mNote').value = '';
  save(); renderAll(); toast('Занятие добавлено');
};

/* ---------- Stats ---------- */
function renderStats() {
  const t = today();
  const tm = minutesOn(t);
  $('sToday').textContent = fmtMin(tm);
  let w = 0; for (let i = 0; i < 7; i++) w += minutesOn(dkey(addDays(new Date(), -i)));
  $('sWeek').textContent = fmtMin(w);
  let streak = 0, d = new Date();
  if (minutesOn(dkey(d)) === 0) d = addDays(d, -1);
  while (minutesOn(dkey(d)) > 0) { streak++; d = addDays(d, -1); }
  $('sStreak').textContent = streak;
  $('goalVal').textContent = `${fmtMin(tm)} / ${fmtMin(S.goal)}`;
  $('goalBar').style.width = Math.min(100, tm / S.goal * 100) + '%';

  // heatmap: 20 weeks ending this week
  const heat = $('heat'); heat.innerHTML = '';
  const now = new Date(); const dow = (now.getDay() + 6) % 7; // Mon=0
  const start = addDays(now, -(19*7 + dow));
  const maxM = Math.max(60, ...Array.from({length:140}, (_, i) => minutesOn(dkey(addDays(start, i)))));
  for (let i = 0; i < 20*7; i++) {
    const d = addDays(start, i); const el = document.createElement('i');
    if (d > now) { el.style.visibility = 'hidden'; }
    else {
      const m = minutesOn(dkey(d));
      if (m > 0) el.style.background = `color-mix(in srgb, var(--accent) ${Math.round(25 + 75 * Math.min(1, m / maxM))}%, var(--surface-2))`;
      el.dataset.tip = `${d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}: ${fmtMin(m)}`;
    }
    heat.appendChild(el);
  }
}
$('goalBtn').onclick = () => {
  const v = prompt('Цель на день (в минутах):', S.goal);
  if (v && Number(v) > 0) { S.goal = Number(v); save(); renderStats(); }
};

/* ---------- Bar chart ---------- */
let range = 7;
$('rangeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; range = +b.dataset.r; [...$('rangeSeg').children].forEach(x => x.classList.toggle('on', x === b)); renderBars(); };
function niceMax(v) { const steps = [30,60,90,120,180,240,300,360,480,600,720]; return steps.find(s => s >= v) || Math.ceil(v/120)*120; }
function renderBars() {
  const svg = $('barChart'); const W = svg.clientWidth || 600, H = 260;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const padL = 40, padB = 26, padT = 8, padR = 6;
  const days = Array.from({length: range}, (_, i) => addDays(new Date(), i - range + 1));
  const data = days.map(d => { const k = dkey(d); return {d, k, parts: S.subjects.map(s => ({s, m: minutesOn(k, s.id)}))}; });
  const max = niceMax(Math.max(30, ...data.map(x => x.parts.reduce((a,p) => a+p.m, 0))));
  const cw = (W - padL - padR) / range, bw = Math.min(36, cw * .62);
  const y = m => padT + (H - padT - padB) * (1 - m/max);
  let out = '';
  for (let i = 0; i <= 4; i++) {
    const m = max * i / 4, yy = y(m);
    out += `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-dasharray="${i? '3 4':''}"/>`;
    out += `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${m >= 60 ? (m/60).toFixed(m%60?1:0)+'ч' : Math.round(m)+'м'}</text>`;
  }
  data.forEach((x, i) => {
    const cx = padL + cw*i + cw/2;
    let acc = 0;
    const visible = x.parts.filter(p => p.m > 0);
    visible.forEach((p, j) => {
      const y1 = y(acc + p.m), y0 = y(acc); acc += p.m;
      const top = j === visible.length - 1;
      const h = Math.max(1, y0 - y1);
      out += top
        ? `<path d="M${cx-bw/2},${y0} V${y1+Math.min(5,h)} q0,-${Math.min(5,h)} ${Math.min(5,h)},-${Math.min(5,h)} H${cx+bw/2-Math.min(5,h)} q${Math.min(5,h)},0 ${Math.min(5,h)},${Math.min(5,h)} V${y0} Z" fill="${p.s.color}"/>`
        : `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${p.s.color}"/>`;
    });
    const isToday = x.k === today();
    const showLbl = range <= 14 || i % 3 === (range-1) % 3;
    if (showLbl) out += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${isToday ? 'var(--text)' : 'var(--muted)'}" font-weight="${isToday?600:400}">${range <= 7 ? x.d.toLocaleDateString('ru-RU',{weekday:'short'}) : x.d.getDate()}</text>`;
    out += `<rect x="${padL + cw*i}" y="${padT}" width="${cw}" height="${H-padT-padB}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  svg.innerHTML = out;
  svg.querySelectorAll('.hit').forEach(r => {
    r.onmousemove = ev => {
      const x = data[+r.dataset.i]; const tot = x.parts.reduce((a,p)=>a+p.m,0);
      showTip(ev, `<b>${x.d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</b><br>` +
        (tot ? x.parts.filter(p=>p.m>0).map(p => `<div><i style="background:${p.s.color}"></i>${esc(p.s.name)}: ${fmtMin(p.m)}</div>`).join('') + `<div style="margin-top:4px">Всего: <b>${fmtMin(tot)}</b></div>` : 'Нет занятий'));
    };
    r.onmouseleave = hideTip;
  });
  $('legend').innerHTML = S.subjects.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
}

/* ---------- Donut ---------- */
let dRange = 7;
$('donutSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; dRange = +b.dataset.r; [...$('donutSeg').children].forEach(x => x.classList.toggle('on', x === b)); renderDonut(); };
function renderDonut() {
  const from = dRange ? dkey(addDays(new Date(), -dRange + 1)) : '0000';
  const rows = S.subjects.map(s => ({s, m: S.sessions.filter(x => x.subjectId === s.id && x.date >= from).reduce((a,x)=>a+x.dur/60,0)}));
  const tot = rows.reduce((a,r)=>a+r.m,0);
  const R = 70, C = 2*Math.PI*R; let off = 0, out = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="22"/>`;
  if (tot > 0) rows.filter(r => r.m > 0).forEach(r => {
    const len = C * r.m / tot;
    out += `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${r.s.color}" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
    off += len;
  });
  out += `<text x="90" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">${fmtMin(tot)}</text><text x="90" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">всего</text>`;
  $('donut').innerHTML = out;
  $('donutList').innerHTML = rows.sort((a,b)=>b.m-a.m).map(r => `<div><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${r.s.color}"></span>${esc(r.s.name)}<b>${fmtMin(r.m)}${tot ? ` · ${Math.round(r.m/tot*100)}%` : ''}</b></div>`).join('');
}

/* ---------- History ---------- */
let histDays = 7;
function renderHistory() {
  const f = $('histFilter').value;
  const list = S.sessions.filter(x => !f || x.subjectId === f).sort((a,b) => b.date.localeCompare(a.date) || b.start - a.start);
  const box = $('history');
  if (!list.length) { box.innerHTML = '<div class="empty">Пока пусто. Запусти таймер или добавь занятие вручную ✨</div>'; return; }
  const groups = {}; list.forEach(x => (groups[x.date] ||= []).push(x));
  box.innerHTML = '';
  const keys = Object.keys(groups);
  keys.slice(0, histDays).forEach(k => {
    const day = document.createElement('div'); day.className = 'day';
    const d = new Date(k + 'T12:00'); const tot = groups[k].reduce((a,x)=>a+x.dur/60,0);
    day.innerHTML = `<div class="day-h"><span>${k === today() ? 'Сегодня' : d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</span><span>${fmtMin(tot)}</span></div>`;
    groups[k].forEach(x => {
      const s = subj(x.subjectId); const el = document.createElement('div'); el.className = 'sess';
      el.innerHTML = `<span class="dot" style="background:${s.color}"></span><div class="body"><div class="t"></div><div class="n"></div></div><span class="d">${fmtMin(x.dur/60)}</span><button class="icon-btn" title="Изменить заметку">✎</button><button class="icon-btn" title="Удалить">✕</button>`;
      el.querySelector('.t').textContent = s.name;
      el.querySelector('.n').textContent = x.note || '—';
      const [edit, del] = el.querySelectorAll('button');
      edit.onclick = () => { const v = prompt('Что учил:', x.note || ''); if (v !== null) { x.note = v.trim(); save(); renderHistory(); } };
      del.onclick = () => { if (confirm('Удалить это занятие?')) { S.sessions = S.sessions.filter(y => y !== x); save(); renderAll(); } };
      day.appendChild(el);
    });
    box.appendChild(day);
  });
  if (keys.length > histDays) {
    const more = document.createElement('button'); more.className = 'btn small'; more.style.cssText = 'display:block;margin:0 auto';
    more.textContent = `Показать ещё (${keys.length - histDays} дн.)`;
    more.onclick = () => { histDays += 14; renderHistory(); };
    box.appendChild(more);
  }
}
$('histFilter').onchange = () => { histDays = 7; renderHistory(); };

/* ---------- Manage subjects ---------- */
let newColor = PALETTE[4];
function openManage() { renderManage(); $('manageModal').classList.add('open'); }
$('manageBtn').onclick = openManage;
$('manageModal').onclick = e => { if (e.target === $('manageModal') || e.target.closest('[data-close]')) $('manageModal').classList.remove('open'); };
function renderManage() {
  const box = $('subList'); box.innerHTML = '';
  S.subjects.forEach(s => {
    const it = document.createElement('div'); it.className = 'it';
    it.innerHTML = `<input type="color" value="${s.color}" style="width:34px;height:34px;padding:0;border:none;background:none;cursor:pointer"><input type="text"><button class="icon-btn" title="Удалить">🗑</button>`;
    const [c, n, del] = [it.children[0], it.children[1], it.children[2]];
    n.value = s.name;
    c.oninput = () => { s.color = c.value; save(); renderAll(); };
    n.onchange = () => { if (n.value.trim()) { s.name = n.value.trim(); save(); renderAll(); } };
    del.onclick = () => {
      if (S.subjects.length <= 1) return toast('Нужен хотя бы один предмет');
      const cnt = S.sessions.filter(x => x.subjectId === s.id).length;
      if (!confirm(`Удалить «${s.name}»?` + (cnt ? ` Вместе с ним удалятся ${cnt} занятий.` : ''))) return;
      S.subjects = S.subjects.filter(x => x !== s);
      S.sessions = S.sessions.filter(x => x.subjectId !== s.id);
      if (S.timer.subjectId === s.id) S.timer.subjectId = S.subjects[0].id;
      save(); renderManage(); renderAll();
    };
    box.appendChild(it);
  });
  $('newColors').innerHTML = PALETTE.map(c => `<button data-c="${c}" style="background:${c}" class="${c===newColor?'on':''}"></button>`).join('');
}
$('newColors').onclick = e => { const b = e.target.closest('button'); if (!b) return; newColor = b.dataset.c; renderManage(); };
$('addSubj').onclick = () => {
  const name = $('newSubj').value.trim(); if (!name) return;
  S.subjects.push({id: 's' + Date.now(), name, color: newColor});
  $('newSubj').value = ''; save(); renderManage(); renderAll();
};

/* ---------- Export / Import ---------- */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `study-tracker-${today()}.json`; a.click();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.subjects) || !Array.isArray(d.sessions)) throw 0;
    if (!confirm('Заменить текущие данные импортированными?')) return;
    S = Object.assign(structuredClone(DEFAULT), d); S.timer = Object.assign({}, DEFAULT.timer, d.timer);
    save(); applyTheme(); renderModes(); renderAll(); toast('Данные импортированы');
  } catch(err) { toast('Не удалось прочитать файл'); }
  e.target.value = '';
};

/* ---------- Tooltip ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTip(ev, html) { const t = $('tip'); t.innerHTML = html; t.style.opacity = 1;
  const x = Math.min(ev.clientX + 14, innerWidth - t.offsetWidth - 8); t.style.left = x + 'px'; t.style.top = (ev.clientY + 14) + 'px'; }
function hideTip() { $('tip').style.opacity = 0; }
$('heat').onmousemove = e => { const el = e.target.closest('i'); if (el && el.dataset.tip) showTip(e, el.dataset.tip); else hideTip(); };
$('heat').onmouseleave = hideTip;

/* ---------- Init ---------- */
function renderAll() { renderSubjects(); renderStats(); renderBars(); renderDonut(); renderHistory(); tick(); }
renderModes(); renderAll();
setInterval(tick, 500);
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 60000);
addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(renderBars, 120); });
})();
</script>
</body>
</html>
